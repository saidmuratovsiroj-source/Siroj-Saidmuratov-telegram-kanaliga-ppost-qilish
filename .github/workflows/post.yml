name: AiPro post

# Railway o'rniga — GitHub Actions bepul jadval.
# Har ishga tushganda bitta post yozadi, chiqaradi va o'chadi.
# Vaqtlar UTC da (GitHub boshqacha bilmaydi). Toshkent = UTC + 5.

on:
  schedule:
    - cron: "0 2 * * *"    # 07:00 Toshkent — fact  (vebinar kanallari)
    - cron: "0 5 * * *"    # 10:00 Toshkent — value (vebinar kanallari)
    - cron: "0 7 * * *"    # 12:00 Toshkent — main  (asosiy kanal, yangilik)
    - cron: "0 12 * * *"   # 17:00 Toshkent — mini  (mini kurs sotuv posti)
  workflow_dispatch:
    inputs:
      slot:
        description: "Qaysi post: fact / value / main / mini / closing"
        required: true
        default: "main"
        type: choice
        options: [fact, value, main, mini, closing]

# Bir vaqtda ikkita post ishlamasin — holat fayli buzilmasin
concurrency:
  group: aipro-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # holat faylini repoga qaytarib yozish uchun

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutubxonalar
        run: pip install -r requirements.txt

      - name: Qaysi post ekanini aniqlash
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 2 * * *")  SLOT=fact  ;;
            "0 5 * * *")  SLOT=value ;;
            "0 7 * * *")  SLOT=main  ;;
            "0 12 * * *") SLOT=mini  ;;
            *)            SLOT="${{ inputs.slot }}" ;;
          esac
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Slot: $SLOT"

      - name: Post yozish va chiqarish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_ID:     ${{ secrets.CHANNEL_ID }}
          ADMIN_CHAT_ID:  ${{ secrets.ADMIN_CHAT_ID }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          AUTO_PUBLISH: "1"
          PYTHONUNBUFFERED: "1"
        run: python run.py "${{ steps.pick.outputs.slot }}"

      # Takrorlanmaslik tarixi va ishlatilgan faktlar repoda saqlanadi —
      # aks holda bot ertaga yana bir xil post yozadi.
      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name  "aipro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data funnel/facts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "O'zgarish yo'q."
          else
            git commit -m "holat: ${{ steps.pick.outputs.slot }} ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "push $i urinish muvaffaqiyatsiz, qayta urinamiz…"
              sleep 5
            done
          fi
